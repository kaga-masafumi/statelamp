[platformio]
default_envs = core2-wifi

[env]
platform = espressif32
board = dfrobot_firebeetle2_esp32s3
framework = arduino

build_src_filter =
  +<*>
  -<ble_gatt_adapter.cpp>
  -<core2_display_diagnostic.cpp>
  -<core2_audio.cpp>
  -<core2_orientation.cpp>
  -<core2_orientation_diagnostic.cpp>
  -<core2_orientation_r1_diagnostic.cpp>
  -<core2_phase_c0.cpp>
  -<core2_phase_c1.cpp>
  -<core2_phase_c2.cpp>
  -<core2_phase_c3.cpp>
  -<core2_phase_c4.cpp>
  -<core2_phase_c5.cpp>
  -<core2_state_display.cpp>
  -<core2_touch_diagnostic.cpp>
  -<core2_touch.cpp>
  -<core2_ui.cpp>
  -<core2_wifi.cpp>

board_build.flash_size = 4MB
board_build.flash_mode = qio
board_build.psram_type = opi
upload_speed = 921600
monitor_speed = 115200
monitor_filters = direct, time

lib_deps =
  bblanchon/ArduinoJson@^7.4.2
  adafruit/Adafruit NeoPixel@^1.15.1

build_flags =
  -DBOARD_HAS_PSRAM
  -mfix-esp32-psram-cache-issue
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DCORE_DEBUG_LEVEL=0

# M5Stack Core2 direct-Wi-Fi image. This target is intentionally kept small
# for the first public release; phase diagnostics remain in the private tree.
[env:core2-wifi]
board = m5stack-core2
lib_deps =
  bblanchon/ArduinoJson@^7.4.2
  m5stack/M5Unified@0.2.19
build_src_filter =
  -<*>
  +<statelamp_model.cpp>
  +<core2_ui.cpp>
  +<core2_audio.cpp>
  +<core2_touch.cpp>
  +<core2_orientation.cpp>
  +<core2_wifi.cpp>
build_flags =
  -DCORE_DEBUG_LEVEL=0
  -DCORE2_PHASE_C5
  -DCORE2_WIFI
